<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Branchefy</title>
    <script>
      try {
        var c = localStorage.getItem("branchefy-chrome-mode");
        var mode = c === "white" || c === "colored" ? c : "colored";
        document.documentElement.dataset.chrome = mode;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", mode === "white" ? "#f1f2f6" : "#050505");
      } catch (e) {
        document.documentElement.dataset.chrome = "colored";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/audio/netflix-intro.mp3" as="audio" type="audio/mpeg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
